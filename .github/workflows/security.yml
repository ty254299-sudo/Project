name: Security

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-and-tests:
    name: Semgrep, secrets, and business-rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:api
      - run: npm run test:auth
      - run: npm run test:ai
      - name: Audit installed dependency versions
        run: npm audit --audit-level=high
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.180.0
      - name: Scan source and secrets
        run: semgrep scan --config p/security-audit --config p/secrets --error --exclude node_modules --exclude dist --exclude .expo .

  zap-baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export public web app
        run: npx expo export --platform web --output-dir dist
      - name: Start static preview for container scan
        run: |
          HOST=0.0.0.0 PORT=4174 npm run serve:preview > /tmp/study-sprout-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/study-sprout-preview.log
          exit 1
      - name: Scan public static application
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://host.docker.internal:4174
          allow_issue_writing: false
          fail_action: true
